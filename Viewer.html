<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viewer - Blockbuster Game Show</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      font-family: 'Plus Jakarta Sans', sans-serif !important;
      font-weight: bold !important;
    }
    body {
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      color: #ffffff;
      overflow: hidden;
    }

    @font-face {
      font-family: 'Aptos';
      src: url('Aptos.ttf') format('truetype');
      font-weight: bold;
      font-style: normal;
    }

    /* SVG 3D Animation Styles */
    svg {
      perspective: 1000px;
      transform-style: preserve-3d;
    }

    .cell-anim-wrapper {
      transform-box: fill-box;
      transform-origin: center;
      transform-style: preserve-3d;
    }

    /* 1. Animation HIỆN BẢNG: Xoay ngang 3D theo trục dọc (Y-axis) + To dần */
    .anim-show-board {
      animation: showBoardEntrance 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes showBoardEntrance {
      0% {
        transform: scale(0) rotateY(-360deg);
        opacity: 0;
      }
      100% {
        transform: scale(1) rotateY(0deg);
        opacity: 1;
      }
    }

    /* 2. Animation ô được chọn: Nhấp nháy liên tục giữa màu hiện tại của ô và màu đen */
    .anim-selected-blink {
      animation: selectedBlink 0.65s infinite alternate ease-in-out !important;
    }

    @keyframes selectedBlink {
      0% {
        fill: var(--cell-current-color, #FFC700);
      }
      100% {
        fill: #000000;
      }
    }

    /* 3. Animation khi tô màu ô: Xoay 180 độ ngược chiều kim đồng hồ theo trục dọc (3D Y-axis) */
    .anim-color-rotate {
      animation: colorRotate180 0.65s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes colorRotate180 {
      0% {
        transform: rotateY(0deg);
      }
      100% {
        transform: rotateY(-180deg);
      }
    }

    .anim-color-rotate text {
      animation: textCounterRotate 0.65s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes textCounterRotate {
      0% {
        transform: rotateY(0deg);
      }
      100% {
        transform: rotateY(180deg);
      }
    }
  </style>
</head>
<body class="h-screen w-screen m-0 p-0 overflow-hidden flex items-center justify-center select-none">

  <!-- Missing/Invalid Room ID Full Screen Error Modal -->
  <div id="roomErrorScreen" class="fixed inset-0 z-50 bg-slate-900/95 backdrop-blur-md flex items-center justify-center p-6 text-center">
    <div class="max-w-md w-full bg-slate-800 border-2 border-rose-500/50 rounded-3xl p-8 shadow-2xl flex flex-col items-center gap-4">
      <div class="w-16 h-16 rounded-full bg-rose-500/20 border-2 border-rose-500/40 flex items-center justify-center text-rose-400">
        <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
      </div>
      <h2 id="roomErrorTitle" class="text-2xl font-black text-rose-400">THÔNG BÁO MÃ PHÒNG</h2>
      <p id="roomErrorMessage" class="text-base font-extrabold text-slate-200">
        Vui lòng nhập tham số ?roomid trên URL.
      </p>
      <div class="text-xs text-slate-400 font-bold bg-slate-900/80 px-4 py-2 rounded-xl border border-slate-700 w-full">
        Ví dụ: Viewer.html?roomid=123456
      </div>
    </div>
  </div>

  <!-- Main Board Canvas Center ONLY -->
  <main id="mainViewerContent" class="w-full h-full flex flex-col items-center justify-center relative p-4 hidden">
    
    <!-- Waiting placeholder when board is hidden -->
    <div id="hiddenPlaceholder" class="flex flex-col items-center justify-center gap-4 p-12 bg-slate-800/40 border-4 border-dashed border-slate-700 rounded-3xl backdrop-blur-sm max-w-xl w-full text-center">
      <div class="w-24 h-24 rounded-full bg-amber-500/20 border-2 border-amber-500/40 flex items-center justify-center text-amber-400 animate-pulse">
        <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
      </div>
      <h2 class="text-3xl font-black text-slate-200">ĐANG CHỜ HIỆN BẢNG</h2>
      <p class="text-base font-bold text-slate-400">Chờ Ban tổ chức phát tín hiệu mở bảng...</p>
    </div>

    <!-- Active Hex Board SVG -->
    <div id="boardContainer" class="w-full h-full flex justify-center items-center hidden">
      <svg id="hexBoard" viewBox="0 0 650 500" class="max-w-full max-h-[92vh] w-auto h-auto drop-shadow-[0_25px_60px_rgba(0,0,0,0.9)]">
        <!-- Rendered by JS -->
      </svg>
    </div>

  </main>

  <!-- Viewer Script -->
  <script>
    function disableDevTools() {
      document.addEventListener('contextmenu', (e) => e.preventDefault());
      document.addEventListener('keydown', (e) => {
        if (
          e.key === 'F12' ||
          (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) ||
          (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.key === 'S' || e.key === 's'))
        ) {
          e.preventDefault();
          return false;
        }
      });
    }
    disableDevTools();

    const urlParams = new URLSearchParams(window.location.search);
    const roomIdParam = urlParams.get('roomid');

    const roomErrorScreen = document.getElementById('roomErrorScreen');
    const roomErrorMessage = document.getElementById('roomErrorMessage');
    const mainViewerContent = document.getElementById('mainViewerContent');

    if (!roomIdParam || !roomIdParam.trim()) {
      roomErrorMessage.textContent = "Vui lòng nhập tham số ?roomid trên URL.";
      roomErrorScreen.classList.remove('hidden');
      mainViewerContent.classList.add('hidden');
    } else {
      roomErrorScreen.classList.add('hidden');
      mainViewerContent.classList.remove('hidden');
    }

    const socket = io();
    let gameState = null;
    let prevShowAnimKey = 0;
    let prevCellColors = Array(20).fill('');
    let currentRenderedRound = null;

    function getFlatHexPolygonLocal(r) {
      let pts = [];
      for (let i = 0; i < 6; i++) {
        let angle = (60 * i) * Math.PI / 180;
        let x = r * Math.cos(angle);
        let y = r * Math.sin(angle);
        pts.push(`${x.toFixed(1)},${y.toFixed(1)}`);
      }
      return pts.join(' ');
    }

    function renderBoard() {
      if (!roomIdParam || !roomIdParam.trim()) return;

      const svg = document.getElementById('hexBoard');
      const placeholder = document.getElementById('hiddenPlaceholder');
      const boardContainer = document.getElementById('boardContainer');
      svg.innerHTML = '';

      if (!gameState) return;

      if (gameState.credentials && gameState.credentials.roomId) {
        if (roomIdParam.trim() !== gameState.credentials.roomId.trim()) {
          roomErrorMessage.textContent = `Mã phòng "${roomIdParam}" không chính xác. Mã phòng hiện tại: ${gameState.credentials.roomId}`;
          roomErrorScreen.classList.remove('hidden');
          mainViewerContent.classList.add('hidden');
          return;
        } else {
          roomErrorScreen.classList.add('hidden');
          mainViewerContent.classList.remove('hidden');
        }
      }

      const r = gameState.currentRound;
      const roundBoard = gameState.roundBoards[r];

      const isNewlyShown = boardContainer.classList.contains('hidden');

      if (!roundBoard || !roundBoard.visible) {
        placeholder.classList.remove('hidden');
        boardContainer.classList.add('hidden');
        return;
      }

      placeholder.classList.add('hidden');
      boardContainer.classList.remove('hidden');

      if (isNewlyShown) {
        void boardContainer.offsetWidth;
      }

      const letters = roundBoard.letters || [];
      const cellColors = roundBoard.cellColors || [];
      const selectedIndices = roundBoard.selectedIndices || [];
      const showAnimKey = roundBoard.showAnimKey || 0;

      const hexRadius = 42;
      const colStep = 1.5 * hexRadius;
      const rowStep = Math.sqrt(3) * hexRadius;
      const startX = 130;
      const startY = 110;

      const isRound3 = (r === 3);

      if (currentRenderedRound !== r) {
        currentRenderedRound = r;
        prevCellColors = [...cellColors];
      }

      const shouldShowAnim = (showAnimKey !== prevShowAnimKey && showAnimKey > 0);
      if (shouldShowAnim) {
        prevShowAnimKey = showAnimKey;
      }

      const localPts = getFlatHexPolygonLocal(hexRadius);

      // Outer Decorative Hexes
      const outerHexes = [
        { col: -1, row: -1, type: 'blue' },
        { col: -1, row: 0, type: 'blue' },
        { col: -1, row: 1, type: 'blue' },
        { col: -1, row: 2, type: 'blue' },
        { col: -1, row: 3, type: 'blue' },
        { col: 5, row: -1, type: 'blue' },
        { col: 5, row: 0, type: 'blue' },
        { col: 5, row: 1, type: 'blue' },
        { col: 5, row: 2, type: 'blue' },
        { col: 5, row: 3, type: 'blue' },
        { col: 0, row: -1, type: 'white' },
        { col: 1, row: -1, type: 'white' },
        { col: 2, row: -1, type: 'white' },
        { col: 3, row: -1, type: 'white' },
        { col: 4, row: -1, type: 'white' },
        { col: 0, row: 4, type: 'white' },
        { col: 1, row: 4, type: 'white' },
        { col: 2, row: 4, type: 'white' },
        { col: 3, row: 4, type: 'white' },
        { col: 4, row: 4, type: 'white' }
      ];

      const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
      defs.innerHTML = `
        <pattern id="pat-blue" patternUnits="objectBoundingBox" patternContentUnits="objectBoundingBox" width="1" height="1">
          <image href="BBBlue.png" xlink:href="BBBlue.png" x="0" y="0" width="1" height="1" preserveAspectRatio="none" />
        </pattern>
        <pattern id="pat-gold" patternUnits="objectBoundingBox" patternContentUnits="objectBoundingBox" width="1" height="1">
          <image href="BBGold.png" xlink:href="BBGold.png" x="0" y="0" width="1" height="1" preserveAspectRatio="none" />
        </pattern>
        <pattern id="pat-white" patternUnits="objectBoundingBox" patternContentUnits="objectBoundingBox" width="1" height="1">
          <image href="BBWhite.png" xlink:href="BBWhite.png" x="0" y="0" width="1" height="1" preserveAspectRatio="none" />
        </pattern>
      `;
      svg.appendChild(defs);

      outerHexes.forEach(o => {
        if (isRound3 && o.col >= 0 && o.col <= 4 && (o.row === -1 || o.row === 4)) {
          return; // Skip top 5 and bottom 5 outer hexes in Round 3
        }
        let cx = startX + o.col * colStep;
        let cy = startY + o.row * rowStep + (Math.abs(o.col) % 2 === 1 ? rowStep * 0.5 : 0);

        const gOuter = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        gOuter.setAttribute('transform', `translate(${cx.toFixed(1)}, ${cy.toFixed(1)})`);

        const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
        poly.setAttribute('points', localPts);
        const outerFill = isRound3 ? 'url(#pat-gold)' : (o.type === 'blue' ? 'url(#pat-blue)' : 'url(#pat-white)');
        poly.setAttribute('fill', outerFill);
        poly.setAttribute('stroke', '#0F172A');
        poly.setAttribute('stroke-width', '4');
        poly.setAttribute('opacity', '0.85');
        gOuter.appendChild(poly);

        svg.appendChild(gOuter);
      });

      // 20 Center Playable Hexes
      let index = 0;
      for (let col = 0; col < 5; col++) {
        for (let row = 0; row < 4; row++) {
          let cx = startX + col * colStep;
          let cy = startY + row * rowStep + (col % 2 === 1 ? rowStep * 0.5 : 0);

          const cellIdx = index;
          const letter = letters[cellIdx] || '';
          const colorState = cellColors[cellIdx] || (isRound3 ? 'white' : 'yellow');
          const isSelected = selectedIndices.includes(cellIdx);

          let fillColor = 'url(#pat-gold)';
          let textColor = '#0F172A';

          if (colorState === 'black') {
            fillColor = '#000000';
            textColor = '#FFFFFF';
          } else if (isRound3) {
            if (colorState === 'yellow' || colorState === 'blue') {
              fillColor = 'url(#pat-gold)';
              textColor = '#0F172A';
            } else {
              fillColor = 'url(#pat-white)';
              textColor = '#0F172A';
            }
          } else {
            if (colorState === 'blue') {
              fillColor = 'url(#pat-blue)';
              textColor = '#FFFFFF';
            } else if (colorState === 'white') {
              fillColor = 'url(#pat-white)';
              textColor = '#000000';
            } else {
              fillColor = 'url(#pat-gold)';
              textColor = '#0F172A';
            }
          }

          const baseColor = fillColor;

          const gOuter = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          gOuter.setAttribute('transform', `translate(${cx.toFixed(1)}, ${cy.toFixed(1)})`);

          const gAnim = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          gAnim.setAttribute('class', 'cell-anim-wrapper');

          const colorChanged = prevCellColors[cellIdx] && prevCellColors[cellIdx] !== colorState;

          if (shouldShowAnim) {
            gAnim.classList.add('anim-show-board');
            gAnim.style.animationDelay = `${(col * 4 + row) * 0.03}s`;
          } else if (colorChanged) {
            gAnim.classList.add('anim-color-rotate');
          }

          const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
          poly.setAttribute('points', localPts);
          poly.setAttribute('fill', fillColor);
          poly.setAttribute('stroke', '#0F172A');
          poly.setAttribute('stroke-width', '3.5');

          if (isSelected) {
            poly.style.setProperty('--cell-current-color', baseColor);
            poly.classList.add('anim-selected-blink');
            textColor = '#FFFFFF';
          }

          gAnim.appendChild(poly);

          if (letter) {
            const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            text.setAttribute('x', '0');
            text.setAttribute('y', '9');
            text.setAttribute('text-anchor', 'middle');
            text.setAttribute('fill', textColor);
            text.setAttribute('font-size', '22');
            text.setAttribute('font-weight', 'bold');
            text.setAttribute('font-family', 'Aptos, sans-serif');
            text.textContent = letter;
            gAnim.appendChild(text);
          }

          gOuter.appendChild(gAnim);
          svg.appendChild(gOuter);
          index++;
        }
      }

      prevCellColors = [...cellColors];
    }

    socket.on('connect', () => {
      if (roomIdParam && roomIdParam.trim()) {
        socket.emit('join:room', { roomId: roomIdParam.trim() });
      }
    });

    let flashTimer = null;
    function updateFlashEffect() {
      if (gameState && gameState.flashEffect && gameState.flashEffect.type) {
        const remaining = gameState.flashEffect.expireTime - Date.now();
        if (remaining > 0) {
          if (gameState.flashEffect.type === 'green') {
            document.body.style.background = '#059669';
          } else if (gameState.flashEffect.type === 'red') {
            document.body.style.background = '#dc2626';
          }
          if (flashTimer) clearTimeout(flashTimer);
          flashTimer = setTimeout(() => {
            document.body.style.background = 'radial-gradient(circle at center, #1e293b 0%, #0f172a 100%)';
          }, remaining);
          return;
        }
      }
      document.body.style.background = 'radial-gradient(circle at center, #1e293b 0%, #0f172a 100%)';
    }

    socket.on('state:update', (data) => {
      gameState = data;
      updateFlashEffect();
      renderBoard();
    });

    if (roomIdParam && roomIdParam.trim()) {
      socket.emit('join:room', { roomId: roomIdParam.trim() });
    }
  </script>
</body>
</html>
