<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viewer - Blockbuster Game Show</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      font-family: 'Plus Jakarta Sans', sans-serif !important;
      font-weight: bold !important;
    }
    body {
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      color: #ffffff;
      overflow: hidden;
    }

    .hex-cell {
      transition: filter 0.2s ease, transform 0.2s ease;
    }

    /* Animation 1: Reveal Board Cells (Rotate Y counter-clockwise + scale up simultaneously) */
    @keyframes revealBoardCell {
      0% {
        transform: rotateY(-360deg) scale(0);
        opacity: 0;
      }
      100% {
        transform: rotateY(0deg) scale(1);
        opacity: 1;
      }
    }

    .cell-reveal {
      transform-box: fill-box;
      transform-origin: center;
      animation: revealBoardCell 0.7s cubic-bezier(0.34, 1.25, 0.64, 1) forwards;
    }

    /* Animation 2: Selected cell blinking continuously between current color and black */
    @keyframes blinkSelectedPolygon {
      0%, 100% {
        fill: var(--cell-color);
      }
      50% {
        fill: #000000;
      }
    }

    @keyframes blinkSelectedText {
      0%, 100% {
        fill: var(--text-color);
      }
      50% {
        fill: #ffffff;
      }
    }

    .cell-selected polygon {
      animation: blinkSelectedPolygon 0.6s infinite ease-in-out !important;
    }

    .cell-selected text {
      animation: blinkSelectedText 0.6s infinite ease-in-out !important;
    }

    /* Animation 3: Coloring a cell (rotates 180 degrees counter-clockwise) */
    @keyframes flipColorCell {
      0% {
        transform: rotateY(0deg);
      }
      50% {
        transform: rotateY(-90deg);
      }
      100% {
        transform: rotateY(-180deg);
      }
    }

    @keyframes flipColorText {
      0% {
        transform: rotateY(0deg);
      }
      50% {
        transform: rotateY(-90deg);
      }
      100% {
        transform: rotateY(-180deg) scaleX(-1);
      }
    }

    .cell-flip-color {
      transform-box: fill-box;
      transform-origin: center;
      animation: flipColorCell 0.6s ease-in-out forwards;
    }

    .cell-flip-color text {
      transform-box: fill-box;
      transform-origin: center;
      animation: flipColorText 0.6s ease-in-out forwards;
    }

    @font-face {
      font-family: 'Aptos';
      src: url('Aptos.ttf') format('truetype');
      font-weight: bold;
      font-style: normal;
    }
  </style>
</head>
<body class="h-screen w-screen m-0 p-0 overflow-hidden flex items-center justify-center select-none">

  <!-- Missing/Invalid Room ID Full Screen Error Modal -->
  <div id="roomErrorScreen" class="fixed inset-0 z-50 bg-slate-900/95 backdrop-blur-md flex items-center justify-center p-6 text-center">
    <div class="max-w-md w-full bg-slate-800 border-2 border-rose-500/50 rounded-3xl p-8 shadow-2xl flex flex-col items-center gap-4">
      <div class="w-16 h-16 rounded-full bg-rose-500/20 border-2 border-rose-500/40 flex items-center justify-center text-rose-400">
        <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
      </div>
      <h2 id="roomErrorTitle" class="text-2xl font-black text-rose-400">THÔNG BÁO MÃ PHÒNG</h2>
      <p id="roomErrorMessage" class="text-base font-extrabold text-slate-200">
        Vui lòng nhập tham số ?roomid trên URL.
      </p>
      <div class="text-xs text-slate-400 font-bold bg-slate-900/80 px-4 py-2 rounded-xl border border-slate-700 w-full">
        Ví dụ: Viewer.html?roomid=123456
      </div>
    </div>
  </div>

  <!-- Main Board Canvas Center ONLY -->
  <main id="mainViewerContent" class="w-full h-full flex flex-col items-center justify-center relative p-4 hidden">
    
    <!-- Waiting placeholder when board is hidden -->
    <div id="hiddenPlaceholder" class="flex flex-col items-center justify-center gap-4 p-12 bg-slate-800/40 border-4 border-dashed border-slate-700 rounded-3xl backdrop-blur-sm max-w-xl w-full text-center">
      <div class="w-24 h-24 rounded-full bg-amber-500/20 border-2 border-amber-500/40 flex items-center justify-center text-amber-400 animate-pulse">
        <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
      </div>
      <h2 class="text-3xl font-black text-slate-200">ĐANG CHỜ HIỆN BẢNG</h2>
      <p class="text-base font-bold text-slate-400">Chờ Ban tổ chức phát tín hiệu mở bảng...</p>
    </div>

    <!-- Active Hex Board SVG -->
    <div id="boardContainer" class="w-full h-full flex justify-center items-center hidden">
      <svg id="hexBoard" viewBox="0 0 650 500" class="max-w-full max-h-[92vh] w-auto h-auto drop-shadow-[0_25px_60px_rgba(0,0,0,0.9)]">
        <!-- Rendered by JS -->
      </svg>
    </div>

  </main>

  <!-- Viewer Script -->
  <script>
    // Disable DevTools
    function disableDevTools() {
      document.addEventListener('contextmenu', (e) => e.preventDefault());
      document.addEventListener('keydown', (e) => {
        if (
          e.key === 'F12' ||
          (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) ||
          (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.key === 'S' || e.key === 's'))
        ) {
          e.preventDefault();
          return false;
        }
      });
    }
    disableDevTools();

    // Validate URL parameter ?roomid
    const urlParams = new URLSearchParams(window.location.search);
    const roomIdParam = urlParams.get('roomid');

    const roomErrorScreen = document.getElementById('roomErrorScreen');
    const roomErrorMessage = document.getElementById('roomErrorMessage');
    const mainViewerContent = document.getElementById('mainViewerContent');

    if (!roomIdParam || !roomIdParam.trim()) {
      roomErrorMessage.textContent = "Vui lòng nhập tham số ?roomid trên URL.";
      roomErrorScreen.classList.remove('hidden');
      mainViewerContent.classList.add('hidden');
    } else {
      roomErrorScreen.classList.add('hidden');
      mainViewerContent.classList.remove('hidden');
    }

    const socket = io();
    let gameState = null;
    let previousBoardVisible = false;
    let previousCellColors = [];
    let previousRound = null;
    let isBoardJustShown = false;

    // Flat Hex Geometry (rotated 30 degrees)
    function getFlatHexPolygon(cx, cy, r) {
      let pts = [];
      for (let i = 0; i < 6; i++) {
        let angle = (60 * i) * Math.PI / 180;
        let x = cx + r * Math.cos(angle);
        let y = cy + r * Math.sin(angle);
        pts.push(`${x.toFixed(1)},${y.toFixed(1)}`);
      }
      return pts.join(' ');
    }

    function renderBoard() {
      if (!roomIdParam || !roomIdParam.trim()) return;

      const svg = document.getElementById('hexBoard');
      const placeholder = document.getElementById('hiddenPlaceholder');
      const boardContainer = document.getElementById('boardContainer');
      svg.innerHTML = '';

      if (!gameState) return;

      // Check room ID validity against server state
      if (gameState.credentials && gameState.credentials.roomId) {
        if (roomIdParam.trim() !== gameState.credentials.roomId.trim()) {
          roomErrorMessage.textContent = `Mã phòng "${roomIdParam}" không chính xác. Mã phòng hiện tại: ${gameState.credentials.roomId}`;
          roomErrorScreen.classList.remove('hidden');
          mainViewerContent.classList.add('hidden');
          return;
        } else {
          roomErrorScreen.classList.add('hidden');
          mainViewerContent.classList.remove('hidden');
        }
      }

      const r = gameState.currentRound;
      const roundBoard = gameState.roundBoards[r];

      const isVisible = roundBoard ? roundBoard.visible : false;
      if (!isVisible) {
        placeholder.classList.remove('hidden');
        boardContainer.classList.add('hidden');
        previousBoardVisible = false;
        return;
      }

      placeholder.classList.add('hidden');
      boardContainer.classList.remove('hidden');

      if (isVisible && (!previousBoardVisible || previousRound !== r || isBoardJustShown)) {
        isBoardJustShown = true;
      }

      const letters = roundBoard.letters || [];
      const cellColors = roundBoard.cellColors || [];
      const selectedIndices = roundBoard.selectedIndices || [];

      const hexRadius = 42;
      const colStep = 1.5 * hexRadius; // 63
      const rowStep = Math.sqrt(3) * hexRadius; // ~72.74
      const startX = 130;
      const startY = 110;

      const isRound3 = (r === 3);

      // Outer Decorative Blue & White Hexes
      const outerHexes = [
        { col: -1, row: -1, type: 'blue' },
        { col: -1, row: 0, type: 'blue' },
        { col: -1, row: 1, type: 'blue' },
        { col: -1, row: 2, type: 'blue' },
        { col: -1, row: 3, type: 'blue' },
        { col: 5, row: -1, type: 'blue' },
        { col: 5, row: 0, type: 'blue' },
        { col: 5, row: 1, type: 'blue' },
        { col: 5, row: 2, type: 'blue' },
        { col: 5, row: 3, type: 'blue' },
        { col: 0, row: -1, type: 'white' },
        { col: 1, row: -1, type: 'white' },
        { col: 2, row: -1, type: 'white' },
        { col: 3, row: -1, type: 'white' },
        { col: 4, row: -1, type: 'white' },
        { col: 0, row: 4, type: 'white' },
        { col: 1, row: 4, type: 'white' },
        { col: 2, row: 4, type: 'white' },
        { col: 3, row: 4, type: 'white' },
        { col: 4, row: 4, type: 'white' }
      ];

      outerHexes.forEach(o => {
        let cx = startX + o.col * colStep;
        let cy = startY + o.row * rowStep + (Math.abs(o.col) % 2 === 1 ? rowStep * 0.5 : 0);
        let pts = getFlatHexPolygon(cx, cy, hexRadius);

        const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
        poly.setAttribute('points', pts);
        const outerFill = isRound3 ? '#FFC700' : (o.type === 'blue' ? '#0284C7' : '#F1F5F9');
        poly.setAttribute('fill', outerFill);
        poly.setAttribute('stroke', '#0F172A');
        poly.setAttribute('stroke-width', '4');
        poly.setAttribute('opacity', '0.9');
        svg.appendChild(poly);
      });

      // 20 Center Playable Hexes
      let index = 0;
      for (let col = 0; col < 5; col++) {
        for (let row = 0; row < 4; row++) {
          let cx = startX + col * colStep;
          let cy = startY + row * rowStep + (col % 2 === 1 ? rowStep * 0.5 : 0);
          let pts = getFlatHexPolygon(cx, cy, hexRadius);

          const cellIdx = index;
          const letter = letters[cellIdx] || '';
          const colorState = cellColors[cellIdx] || (isRound3 ? 'white' : 'yellow');
          const isSelected = selectedIndices.includes(cellIdx);

          let fillColor = '#FFC700';
          let textColor = '#0F172A';

          if (isRound3) {
            if (isSelected) {
              fillColor = '#F97316';
              textColor = '#FFFFFF';
            } else if (colorState === 'black') {
              fillColor = '#0F172A';
              textColor = '#FFFFFF';
            } else if (colorState === 'yellow' || colorState === 'blue') {
              fillColor = '#FFC700';
              textColor = '#0F172A';
            } else {
              fillColor = '#FFFFFF';
              textColor = '#0F172A';
            }
          } else {
            if (isSelected) {
              fillColor = '#F97316';
              textColor = '#FFFFFF';
            } else if (colorState === 'blue') {
              fillColor = '#2563EB';
              textColor = '#FFFFFF';
            } else if (colorState === 'white') {
              fillColor = '#FFFFFF';
              textColor = '#000000';
            } else {
              fillColor = '#FFC700';
              textColor = '#0F172A';
            }
          }

          const isColorChanged = previousBoardVisible && (previousRound === r) && (!isBoardJustShown) &&
                                 (previousCellColors[cellIdx] !== undefined) &&
                                 (previousCellColors[cellIdx] !== colorState);

          const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          let classList = ['hex-cell'];

          if (isBoardJustShown) {
            classList.push('cell-reveal');
            g.style.animationDelay = `${cellIdx * 30}ms`;
          } else if (isColorChanged) {
            classList.push('cell-flip-color');
          }

          if (isSelected) {
            classList.push('cell-selected');
            g.style.setProperty('--cell-color', fillColor);
            g.style.setProperty('--text-color', textColor);
          }

          g.setAttribute('class', classList.join(' '));

          const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
          poly.setAttribute('points', pts);
          poly.setAttribute('fill', fillColor);
          poly.setAttribute('stroke', '#0F172A');
          poly.setAttribute('stroke-width', '4');
          g.appendChild(poly);

          if (letter) {
            const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            text.setAttribute('x', cx);
            text.setAttribute('y', cy + 9);
            text.setAttribute('text-anchor', 'middle');
            text.setAttribute('fill', textColor);
            text.setAttribute('font-size', '22');
            text.setAttribute('font-weight', 'bold');
            text.setAttribute('font-family', 'Aptos, sans-serif');
            text.textContent = letter;
            g.appendChild(text);
          }

          svg.appendChild(g);
          index++;
        }
      }

      previousBoardVisible = isVisible;
      previousCellColors = [...cellColors];
      previousRound = r;
      isBoardJustShown = false;
    }

    socket.on('connect', () => {
      if (roomIdParam && roomIdParam.trim()) {
        socket.emit('join:room', { roomId: roomIdParam.trim() });
      }
    });

    socket.on('state:update', (data) => {
      gameState = data;
      renderBoard();
    });

    if (roomIdParam && roomIdParam.trim()) {
      socket.emit('join:room', { roomId: roomIdParam.trim() });
    }
  </script>
</body>
</html>
