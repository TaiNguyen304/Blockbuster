<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player - Blockbuster Game Show</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      font-family: 'Plus Jakarta Sans', sans-serif !important;
      font-weight: bold !important;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif !important;
      font-weight: bold !important;
      background-image: url('bg.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #ffffff;
      overflow-x: hidden;
      min-height: 100vh;
      position: relative;
    }

    .hex-cell-outer {
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
      transform-style: preserve-3d;
    }
    .hex-cell-outer:hover {
      filter: brightness(1.15) drop-shadow(0px 8px 12px rgba(0,0,0,0.5));
      transform: translateZ(20px) scale(1.05);
    }

    .buzzer-unlocked {
      background: #059669; /* Green */
      color: #ffffff;
      box-shadow: 0 0 35px rgba(16, 185, 129, 0.7), inset 0 3px 8px rgba(255, 255, 255, 0.4);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .buzzer-unlocked:hover {
      background: #f97316 !important; /* Orange */
      color: #ffffff !important;
      box-shadow: 0 0 45px rgba(249, 115, 22, 0.9) !important;
      transform: scale(1.03);
    }
    .buzzer-locked {
      background: #334155;
      box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.6);
      cursor: not-allowed;
      opacity: 0.6;
    }

    @font-face {
      font-family: 'Aptos';
      src: url('Aptos.ttf') format('truetype');
      font-weight: bold;
      font-style: normal;
    }

    /* SVG 3D Animation Styles */
    svg {
      perspective: 1200px;
      transform-style: preserve-3d;
    }

    .cell-anim-wrapper {
      transform-box: fill-box;
      transform-origin: center;
      transform-style: preserve-3d;
      transition: transform 0.3s ease;
    }

    /* 1. Animation HIỆN BẢNG: Xoay 3D kết hợp X & Y + Phóng to */
    .anim-show-board {
      animation: showBoard3D 0.85s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes showBoard3D {
      0% {
        transform: perspective(800px) rotateX(60deg) rotateY(-180deg) translateZ(-150px) scale(0.2);
        opacity: 0;
      }
      100% {
        transform: perspective(800px) rotateX(0deg) rotateY(0deg) translateZ(0px) scale(1);
        opacity: 1;
      }
    }

    /* 2. Animation ô được chọn: Chỉ nhấp nháy đổi màu */
    .anim-selected-blink {
      animation: selectedBlink 0.65s infinite alternate ease-in-out !important;
    }

    @keyframes selectedBlink {
      0% {
        fill: var(--cell-current-color, #FFC700);
      }
      100% {
        fill: #000000;
      }
    }

    /* 3. Animation khi tô màu ô: Xoay 3D 180 độ lật mặt theo chiều Y + Nẩy 3D ra ngoài */
    .anim-color-rotate {
      animation: colorRotate3D 0.75s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes colorRotate3D {
      0% {
        transform: perspective(600px) rotateY(0deg) translateZ(0px);
      }
      50% {
        transform: perspective(600px) rotateY(-90deg) translateZ(60px) scale(1.15);
      }
      100% {
        transform: perspective(600px) rotateY(-180deg) translateZ(0px);
      }
    }

    .anim-color-rotate text {
      animation: textCounterRotate3D 0.75s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes textCounterRotate3D {
      0% {
        transform: rotateY(0deg);
      }
      50% {
        transform: rotateY(90deg);
      }
      100% {
        transform: rotateY(180deg);
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row w-full select-none overflow-hidden relative">

  <!-- Flash Overlay for Win/Loss Effect over bg.jpg -->
  <div id="flash-overlay" class="fixed inset-0 pointer-events-none transition-opacity duration-500 z-40 opacity-0"></div>

  <!-- 80% Left Screen: Viewer Board Layout -->
  <div class="w-full md:w-[80%] min-h-screen p-4 md:p-6 flex flex-col justify-between items-center border-r-4 border-slate-700/80">
    
    <!-- Header Banner -->
    <header class="w-full max-w-5xl flex items-center justify-between bg-slate-800/80 border-2 border-slate-700/80 rounded-2xl px-6 py-4 shadow-2xl backdrop-blur-md">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-amber-500 to-yellow-400 flex items-center justify-center text-slate-950 font-black text-2xl shadow-lg shadow-amber-500/30 border-2 border-amber-300">
          B
        </div>
        <div>
          <h1 class="text-2xl md:text-3xl font-black text-white tracking-wider flex items-center gap-3">
            MÀN HÌNH PLAYER <span id="roundHeader" class="text-amber-400 bg-amber-500/20 px-3 py-1 rounded-xl border-2 border-amber-500/40 text-lg md:text-xl">VÒNG 1</span>
          </h1>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <div class="bg-slate-900/90 border-2 border-slate-700 px-3 py-1.5 rounded-xl text-xs font-black text-slate-300">
          PHÒNG: <span id="displayRoomId" class="text-amber-400 font-extrabold">------</span>
        </div>
        <div class="flex items-center gap-2 bg-slate-900/90 border-2 border-slate-700 px-4 py-1.5 rounded-xl text-amber-400 text-sm font-black">
          <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
          <span>TRỰC TIẾP</span>
        </div>
      </div>
    </header>

    <!-- Main Board Canvas Center -->
    <main class="w-full max-w-5xl flex-1 flex flex-col items-center justify-center my-4 relative">
      
      <!-- Waiting placeholder when board is hidden -->
      <div id="hiddenPlaceholder" class="flex flex-col items-center justify-center gap-4 p-12 bg-slate-800/40 border-4 border-dashed border-slate-700 rounded-3xl backdrop-blur-sm max-w-lg w-full text-center">
        <div class="w-20 h-20 rounded-full bg-amber-500/20 border-2 border-amber-500/40 flex items-center justify-center text-amber-400 animate-pulse">
          <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
        </div>
        <h2 class="text-2xl font-black text-slate-300">ĐANG CHỜ HIỆN BẢNG</h2>
        <p class="text-sm font-bold text-slate-400">Chuẩn bị chuông để dành quyền trả lời...</p>
      </div>

      <!-- Active Hex Board SVG -->
      <div id="boardContainer" class="w-full flex justify-center items-center hidden">
        <svg id="playerHexBoard" viewBox="0 0 650 500" class="w-full max-w-[650px] h-auto drop-shadow-[0_20px_50px_rgba(0,0,0,0.8)]">
          <!-- Rendered by JS -->
        </svg>
      </div>

    </main>

  </div>

  <!-- 20% Right Screen: 3 Vertical Boxes + Bottom Right Buzzer Button -->
  <div class="w-full md:w-[20%] min-h-screen bg-slate-900/90 p-4 md:p-6 flex flex-col justify-between items-center shadow-2xl gap-4">
    
    <!-- Top 3 Stacked Boxes -->
    <div class="w-full flex flex-col gap-4">
      <!-- Box 1: PLAYER -->
      <div id="boxPlayer" class="w-full h-24 md:h-28 rounded-2xl bg-purple-600 border-4 border-purple-400/50 flex flex-col items-center justify-center text-white shadow-xl transition-all duration-300">
        <span class="text-xl md:text-2xl font-black tracking-widest">PLAYER</span>
        <span id="playerStatusText" class="text-xs font-extrabold mt-0.5 opacity-80">CHỜ CHUÔNG</span>
      </div>

      <!-- Box 2: COUPLE -->
      <div id="boxCouple" class="w-full h-24 md:h-28 rounded-2xl bg-purple-600 border-4 border-purple-400/50 flex flex-col items-center justify-center text-white shadow-xl transition-all duration-300">
        <span class="text-xl md:text-2xl font-black tracking-widest">COUPLE</span>
        <span id="coupleStatusText" class="text-xs font-extrabold mt-0.5 opacity-80">CHỜ CHUÔNG</span>
      </div>

      <!-- Box 3: CLOCK / TIMER -->
      <div id="boxClock" class="w-full h-24 md:h-28 rounded-2xl bg-red-600 border-4 border-red-400/50 flex flex-col items-center justify-center text-white shadow-xl transition-all duration-300">
        <span class="text-[10px] font-black tracking-widest uppercase opacity-90">ĐỒNG HỒ</span>
        <span id="playerTimerDisplay" class="text-3xl md:text-4xl font-black tracking-wider text-white">60s</span>
      </div>
    </div>

    <!-- Bottom Right BUZZER BUTTON -->
    <div class="w-full mt-auto pt-2 flex flex-col items-center">
      <button id="btnPlayerBuzzer" disabled class="w-full h-28 md:h-36 rounded-3xl border-4 border-slate-700 flex flex-col items-center justify-center gap-1 text-white text-center transition-all duration-200 buzzer-locked select-none">
        <svg class="w-10 h-10 text-white drop-shadow" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
        <span id="buzzerBtnText" class="text-lg md:text-xl font-black tracking-wider">CHUÔNG KHÓA</span>
      </button>
    </div>

  </div>

  <!-- Player Script -->
  <script>
    function disableDevTools() {
      document.addEventListener('contextmenu', (e) => e.preventDefault());
      document.addEventListener('keydown', (e) => {
        if (
          e.key === 'F12' ||
          (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) ||
          (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.key === 'S' || e.key === 's'))
        ) {
          e.preventDefault();
          return false;
        }
      });
    }
    disableDevTools();

    const urlParams = new URLSearchParams(window.location.search);
    const roomIdParam = urlParams.get('roomid');
    const authParam = urlParams.get('auth');

    if (!roomIdParam || !authParam) {
      window.location.href = '/index.html?reason=missing';
    } else {
      document.getElementById('displayRoomId').textContent = roomIdParam.trim();
    }

    const socket = io();
    let gameState = null;
    let prevShowAnimKey = 0;
    let prevCellColors = Array(20).fill('');
    let currentRenderedRound = null;

    function getFlatHexPolygonLocal(r) {
      let pts = [];
      for (let i = 0; i < 6; i++) {
        let angle = (60 * i) * Math.PI / 180;
        let x = r * Math.cos(angle);
        let y = r * Math.sin(angle);
        pts.push(`${x.toFixed(1)},${y.toFixed(1)}`);
      }
      return pts.join(' ');
    }

    function renderBoard() {
      const svg = document.getElementById('playerHexBoard');
      const placeholder = document.getElementById('hiddenPlaceholder');
      const boardContainer = document.getElementById('boardContainer');
      svg.innerHTML = '';

      if (!gameState) return;

      if (gameState.credentials) {
        const { roomId, playerPassword } = gameState.credentials;
        if (roomIdParam.trim() !== String(roomId).trim() || authParam.trim() !== String(playerPassword).trim()) {
          window.location.href = '/index.html?reason=invalid';
          return;
        }
      }

      const r = gameState.currentRound;
      const roundBoard = gameState.roundBoards[r];

      const roundNames = { 1: 'VÒNG 1', 2: 'VÒNG 2', 3: 'VÒNG ĐẶC BIỆT' };
      document.getElementById('roundHeader').textContent = roundNames[r] || `VÒNG ${r}`;
      document.getElementById('playerTimerDisplay').textContent = `${gameState.timer.seconds}s`;

      const boxPlayer = document.getElementById('boxPlayer');
      const playerStatusText = document.getElementById('playerStatusText');
      const boxCouple = document.getElementById('boxCouple');
      const coupleStatusText = document.getElementById('coupleStatusText');

      if (gameState.buzzer.pressedBy === 'player') {
        boxPlayer.className = 'w-full h-24 md:h-28 rounded-2xl bg-white border-4 border-slate-300 flex flex-col items-center justify-center text-black shadow-[0_0_30px_rgba(255,255,255,0.8)] scale-105 transition-all duration-300';
        playerStatusText.textContent = 'ĐÃ BẤM CHUÔNG!';
      } else {
        boxPlayer.className = 'w-full h-24 md:h-28 rounded-2xl bg-purple-600 border-4 border-purple-400/50 flex flex-col items-center justify-center text-white shadow-xl transition-all duration-300';
        playerStatusText.textContent = 'CHỜ CHUÔNG';
      }

      if (gameState.buzzer.pressedBy === 'couple') {
        boxCouple.className = 'w-full h-24 md:h-28 rounded-2xl bg-blue-600 border-4 border-blue-400 flex flex-col items-center justify-center text-white shadow-[0_0_30px_rgba(37,99,235,0.8)] scale-105 transition-all duration-300';
        coupleStatusText.textContent = 'ĐÃ BẤM CHUÔNG!';
      } else {
        boxCouple.className = 'w-full h-24 md:h-28 rounded-2xl bg-purple-600 border-4 border-purple-400/50 flex flex-col items-center justify-center text-white shadow-xl transition-all duration-300';
        coupleStatusText.textContent = 'CHỜ CHUÔNG';
      }

      const btnBuzzer = document.getElementById('btnPlayerBuzzer');
      const buzzerBtnText = document.getElementById('buzzerBtnText');

      if (gameState.buzzer.locked || gameState.buzzer.pressedBy) {
        btnBuzzer.disabled = true;
        btnBuzzer.className = 'w-full h-28 md:h-36 rounded-3xl border-4 border-slate-700 flex flex-col items-center justify-center gap-1 text-slate-300 text-center transition-all duration-200 buzzer-locked select-none';
        buzzerBtnText.textContent = gameState.buzzer.pressedBy ? 'ĐÃ CÓ NGƯỜI BẤM' : 'CHUÔNG KHÓA';
      } else {
        btnBuzzer.disabled = false;
        btnBuzzer.className = 'w-full h-28 md:h-36 rounded-3xl border-4 border-emerald-400 flex flex-col items-center justify-center gap-1 text-white text-center transition-all duration-200 active:scale-95 buzzer-unlocked select-none';
        buzzerBtnText.textContent = 'BẤM CHUÔNG!';
      }

      const isNewlyShown = boardContainer.classList.contains('hidden');

      if (!roundBoard || !roundBoard.visible) {
        placeholder.classList.remove('hidden');
        boardContainer.classList.add('hidden');
        return;
      }

      placeholder.classList.add('hidden');
      boardContainer.classList.remove('hidden');

      if (isNewlyShown) {
        void boardContainer.offsetWidth;
      }

      const letters = roundBoard.letters || [];
      const cellColors = roundBoard.cellColors || [];
      const selectedIndices = roundBoard.selectedIndices || [];
      const showAnimKey = roundBoard.showAnimKey || 0;

      const hexRadius = 42;
      const colStep = 1.5 * hexRadius;
      const rowStep = Math.sqrt(3) * hexRadius;
      const startX = 130;
      const startY = 110;

      const isRound3 = (r === 3);

      if (currentRenderedRound !== r) {
        currentRenderedRound = r;
        prevCellColors = [...cellColors];
      }

      const shouldShowAnim = (showAnimKey !== prevShowAnimKey && showAnimKey > 0);
      if (shouldShowAnim) {
        prevShowAnimKey = showAnimKey;
      }

      const localPts = getFlatHexPolygonLocal(hexRadius);

      // Outer Decorative Hexes
      const outerHexes = [
        { col: -1, row: -1, type: 'blue' },
        { col: -1, row: 0, type: 'blue' },
        { col: -1, row: 1, type: 'blue' },
        { col: -1, row: 2, type: 'blue' },
        { col: -1, row: 3, type: 'blue' },
        { col: 5, row: -1, type: 'blue' },
        { col: 5, row: 0, type: 'blue' },
        { col: 5, row: 1, type: 'blue' },
        { col: 5, row: 2, type: 'blue' },
        { col: 5, row: 3, type: 'blue' },
        { col: 0, row: -1, type: 'white' },
        { col: 1, row: -1, type: 'white' },
        { col: 2, row: -1, type: 'white' },
        { col: 3, row: -1, type: 'white' },
        { col: 4, row: -1, type: 'white' },
        { col: 0, row: 4, type: 'white' },
        { col: 1, row: 4, type: 'white' },
        { col: 2, row: 4, type: 'white' },
        { col: 3, row: 4, type: 'white' },
        { col: 4, row: 4, type: 'white' }
      ];

      const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
      defs.innerHTML = `
        <pattern id="pat-blue" patternUnits="objectBoundingBox" patternContentUnits="objectBoundingBox" width="1" height="1">
          <image href="BBBlue.png" xlink:href="BBBlue.png" x="0" y="0" width="1" height="1" preserveAspectRatio="none" />
        </pattern>
        <pattern id="pat-gold" patternUnits="objectBoundingBox" patternContentUnits="objectBoundingBox" width="1" height="1">
          <image href="BBGold.png" xlink:href="BBGold.png" x="0" y="0" width="1" height="1" preserveAspectRatio="none" />
        </pattern>
        <pattern id="pat-white" patternUnits="objectBoundingBox" patternContentUnits="objectBoundingBox" width="1" height="1">
          <image href="BBWhite.png" xlink:href="BBWhite.png" x="0" y="0" width="1" height="1" preserveAspectRatio="none" />
        </pattern>
      `;
      svg.appendChild(defs);

      outerHexes.forEach(o => {
        if (isRound3 && o.col >= 0 && o.col <= 4 && (o.row === -1 || o.row === 4)) {
          return; // Skip top 5 and bottom 5 outer hexes in Round 3
        }
        let cx = startX + o.col * colStep;
        let cy = startY + o.row * rowStep + (Math.abs(o.col) % 2 === 1 ? rowStep * 0.5 : 0);

        const gOuter = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        gOuter.setAttribute('transform', `translate(${cx.toFixed(1)}, ${cy.toFixed(1)})`);

        const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
        poly.setAttribute('points', localPts);
        const outerFill = isRound3 ? 'url(#pat-gold)' : (o.type === 'blue' ? 'url(#pat-blue)' : 'url(#pat-white)');
        poly.setAttribute('fill', outerFill);
        poly.setAttribute('stroke', '#0F172A');
        poly.setAttribute('stroke-width', '4');
        poly.setAttribute('opacity', '0.85');
        gOuter.appendChild(poly);

        svg.appendChild(gOuter);
      });

      // 20 Center Playable Hexes
      let index = 0;
      for (let col = 0; col < 5; col++) {
        for (let row = 0; row < 4; row++) {
          let cx = startX + col * colStep;
          let cy = startY + row * rowStep + (col % 2 === 1 ? rowStep * 0.5 : 0);

          const cellIdx = index;
          const letter = letters[cellIdx] || '';
          const colorState = cellColors[cellIdx] || (isRound3 ? 'white' : 'yellow');
          const isSelected = selectedIndices.includes(cellIdx);

          let fillColor = 'url(#pat-gold)';
          let textColor = '#0F172A';

          if (colorState === 'black') {
            fillColor = '#000000';
            textColor = '#FFFFFF';
          } else if (isRound3) {
            if (colorState === 'yellow' || colorState === 'blue') {
              fillColor = 'url(#pat-gold)';
              textColor = '#0F172A';
            } else {
              fillColor = 'url(#pat-white)';
              textColor = '#0F172A';
            }
          } else {
            if (colorState === 'blue') {
              fillColor = 'url(#pat-blue)';
              textColor = '#FFFFFF';
            } else if (colorState === 'white') {
              fillColor = 'url(#pat-white)';
              textColor = '#000000';
            } else {
              fillColor = 'url(#pat-gold)';
              textColor = '#0F172A';
            }
          }

          const baseColor = fillColor;

          const gOuter = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          gOuter.setAttribute('transform', `translate(${cx.toFixed(1)}, ${cy.toFixed(1)})`);

          const gAnim = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          gAnim.setAttribute('class', 'cell-anim-wrapper');

          const colorChanged = prevCellColors[cellIdx] && prevCellColors[cellIdx] !== colorState;

          if (shouldShowAnim) {
            gAnim.classList.add('anim-show-board');
            gAnim.style.animationDelay = `${(col * 4 + row) * 0.03}s`;
          } else if (colorChanged) {
            gAnim.classList.add('anim-color-rotate');
          }

          const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
          poly.setAttribute('points', localPts);
          poly.setAttribute('fill', fillColor);
          poly.setAttribute('stroke', '#0F172A');
          poly.setAttribute('stroke-width', '3.5');

          if (isSelected) {
            poly.style.setProperty('--cell-current-color', baseColor);
            poly.classList.add('anim-selected-blink');
            textColor = '#FFFFFF';
          }

          gAnim.appendChild(poly);

          const baseFontSize = isRound3 ? 22 : 30;

          if (letter) {
            const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            text.setAttribute('x', '0');
            text.setAttribute('y', '10');
            text.setAttribute('text-anchor', 'middle');
            text.setAttribute('fill', textColor);
            text.setAttribute('font-size', baseFontSize.toString());
            text.setAttribute('font-weight', 'bold');
            text.setAttribute('font-family', 'Aptos, sans-serif');
            text.textContent = letter;
            gAnim.appendChild(text);
          }

          gOuter.appendChild(gAnim);
          svg.appendChild(gOuter);
          index++;
        }
      }

      // Auto font-size adjustment if text overflows hexagon width
      svg.querySelectorAll('text').forEach(textNode => {
        try {
          const currentSize = parseFloat(textNode.getAttribute('font-size')) || (isRound3 ? 22 : 30);
          const maxW = 66; // max inner width inside hexagon cell
          const textW = textNode.getComputedTextLength();
          if (textW > maxW && textW > 0) {
            const newSize = Math.max(10, Math.floor(currentSize * (maxW / textW)));
            textNode.setAttribute('font-size', newSize.toString());
            textNode.setAttribute('y', Math.round(newSize * 0.33).toString());
          }
        } catch (err) {}
      });

      prevCellColors = [...cellColors];
    }

    document.getElementById('btnPlayerBuzzer').onclick = () => {
      if (gameState && !gameState.buzzer.locked && !gameState.buzzer.pressedBy) {
        socket.emit('buzzer:press', { team: 'player' });
      }
    };

    socket.on('connect', () => {
      if (roomIdParam && roomIdParam.trim()) {
        socket.emit('join:room', { roomId: roomIdParam.trim() });
      }
    });

    let flashTimer = null;
    function updateFlashEffect() {
      const overlay = document.getElementById('flash-overlay');
      if (gameState && gameState.flashEffect && gameState.flashEffect.type) {
        const remaining = gameState.flashEffect.expireTime - Date.now();
        if (remaining > 0) {
          if (overlay) {
            overlay.className = `fixed inset-0 pointer-events-none transition-opacity duration-500 z-40 opacity-80 ${
              gameState.flashEffect.type === 'green' ? 'bg-emerald-600' : 'bg-red-600'
            }`;
          }
          if (flashTimer) clearTimeout(flashTimer);
          flashTimer = setTimeout(() => {
            if (overlay) overlay.className = 'fixed inset-0 pointer-events-none transition-opacity duration-500 z-40 opacity-0';
          }, remaining);
          return;
        }
      }
      if (overlay) overlay.className = 'fixed inset-0 pointer-events-none transition-opacity duration-500 z-40 opacity-0';
    }

    socket.on('state:update', (data) => {
      gameState = data;
      updateFlashEffect();
      renderBoard();
    });

    socket.on('timer:tick', ({ seconds }) => {
      document.getElementById('playerTimerDisplay').textContent = `${seconds}s`;
    });

    if (roomIdParam && roomIdParam.trim()) {
      socket.emit('join:room', { roomId: roomIdParam.trim() });
    }
  </script>
</body>
</html>
